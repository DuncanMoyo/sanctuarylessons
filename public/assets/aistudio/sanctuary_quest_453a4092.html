<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanctuary Quest — Discover Jesus in the Sanctuary</title>
<style>
:root{--bg:#0b1220;--panel:#131e31;--panel2:#182640;--text:#f1f5f9;--muted:#9caec4;--gold:#e8b55b;--teal:#58c6b4;--line:#263652;--accent:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#172742 0,transparent 45%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 16px;background:var(--gold);color:#1b2431;font-weight:750}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:not-allowed}.wrap{max-width:1120px;margin:auto;padding:26px 20px 60px}.nav{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}.logo{font-weight:900;letter-spacing:.08em;color:var(--gold)}.navlinks{display:flex;gap:8px;flex-wrap:wrap}.navlinks button{padding:8px 12px}.hero{padding:50px 0 28px;display:grid;grid-template-columns:1.4fr .8fr;gap:26px;align-items:center}.eyebrow{color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:.8rem}.hero h1{font-size:clamp(2.5rem,6vw,4.5rem);line-height:1.05;margin:12px 0}.hero p{color:var(--muted);max-width:650px}.hero-art{min-height:240px;border-radius:24px;background:linear-gradient(145deg,#263d5c,#101827);display:flex;align-items:center;justify-content:center;font-size:6rem;border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:linear-gradient(145deg,var(--panel),#10192a);border:1px solid var(--line);border-radius:20px;padding:20px}.card h3{margin:8px 0}.card p{color:var(--muted);margin:6px 0}.stat{font-size:2rem;color:var(--gold);font-weight:900}.progress{height:9px;border-radius:20px;background:#263652;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,var(--gold),var(--teal));width:0;transition:.3s}.section{margin:35px 0}.section h2{font-size:1.6rem}.lesson-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.lesson{cursor:pointer;transition:.18s}.lesson:hover{transform:translateY(-2px);border-color:var(--gold)}.lesson .num{color:var(--gold);font-size:.75rem;font-weight:800;letter-spacing:.1em}.lesson.lock{opacity:.6}.pill{display:inline-block;padding:3px 9px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:.8rem}.content{max-width:800px;margin:30px auto}.content .card{padding:clamp(18px,4vw,32px)}.content h1{line-height:1.1}.verse{border-left:3px solid var(--gold);padding:12px 18px;background:#182640;border-radius:0 12px 12px 0}.question{margin:18px 0;padding:16px;background:var(--panel2);border:1px solid var(--line);border-radius:14px}.question label{display:block;margin:9px 0;cursor:pointer;color:#dbe5f2}.question input{margin-right:8px}.feedback{margin-top:10px;color:var(--teal);font-weight:700}.hidden{display:none}.footer{text-align:center;color:var(--muted);padding-top:30px}.small{font-size:.9rem;color:var(--muted)}@media(max-width:800px){.hero{grid-template-columns:1fr}.hero-art{min-height:170px}.grid{grid-template-columns:1fr}.lesson-grid{grid-template-columns:1fr}.wrap{padding:18px 14px 40px}}
</style></head>
<body><div class="wrap">
<div class="nav"><div class="logo">✦ SANCTUARY QUEST</div><div class="navlinks"><button class="secondary" onclick="home()">Home</button><button class="secondary" onclick="showMap()">Missions</button><button class="secondary" onclick="about()">About</button></div></div>
<div id="app"></div><div class="footer">A Bible learning adventure inspired by <em>The Cross and Its Shadow</em> by S. N. Haskell.<br>Study the Scriptures for yourself. Progress is saved on this device.</div></div>
<script>
const lessons=[
{title:"Light in the Darkness",icon:"🌅",tag:"The promise of redemption",reading:"Chapter 1 — Light in the Darkness",body:`<p>Our sanctuary journey begins before the tabernacle was built. Haskell traces the promise of redemption back to humanity's fall, where the first glimpse of hope appears.</p><p>Read Genesis 3:15 and consider how the sanctuary story is connected to the larger story of the conflict between sin and God's love.</p>`,verses:["Genesis 3:15","Genesis 3:21","Hebrews 11:4"],challenge:"Why does the sanctuary story begin with the promise of redemption instead of with the building of the tabernacle?",quiz:[{q:"Where does Haskell trace the first promise of redemption?",a:["Mount Sinai","The Garden of Eden","The temple in Jerusalem"],correct:1,ex:"Genesis 3:15 introduces the promise after the fall."},{q:"What central theme does Haskell emphasize in the sanctuary symbols?",a:["Human achievement","Political power","Christ and the plan of redemption"],correct:2,ex:"Haskell frames sanctuary types and symbols as pointing to Christ."}]},
{title:"The Sanctuary: God Dwelling With Us",icon:"⛺",tag:"Why build a sanctuary?",reading:"Read the opening sanctuary chapters",body:`<p>God told Israel: “Let them make me a sanctuary; that I may dwell among them.” The sanctuary was more than a structure—it was an object lesson of God's desire to dwell among His people.</p><p>Explore Exodus 25:8–9 and Hebrews 8:1–5. Compare the earthly pattern with the heavenly sanctuary.</p>`,verses:["Exodus 25:8–9","Hebrews 8:1–5","Exodus 40:34–38"],challenge:"What does God's desire to dwell among His people reveal about His character?",quiz:[{q:"What reason does Exodus 25:8 give for building the sanctuary?",a:["To store the tribes' wealth","That God may dwell among them","To establish a royal palace"],correct:1,ex:"The sanctuary was a sign of God's dwelling among His people."},{q:"Hebrews 8 connects the earthly sanctuary with what?",a:["A pattern of heavenly things","A military camp","A market"],correct:0,ex:"Hebrews 8:5 describes the earthly service as a copy and shadow."}]},
{title:"Explore the Courtyard",icon:"🔥",tag:"The first approach",reading:"Study the sanctuary layout in Exodus 27",body:`<p>Imagine entering the courtyard. The altar and laver invite you to explore the themes of sacrifice, cleansing and approach to God. These are not merely ancient objects; they raise questions about how God makes a way for sinners.</p><p>Read Exodus 27:1–8 and Exodus 30:17–21. Take time to sketch or describe the courtyard layout.</p>`,verses:["Exodus 27:1–8","Exodus 30:17–21","John 1:29"],challenge:"Why might sacrifice and cleansing be the first lessons encountered in the courtyard?",quiz:[{q:"Which major object stood in the courtyard?",a:["Altar of burnt offering","Ark of the covenant","Showbread table"],correct:0,ex:"The altar of burnt offering was in the courtyard."},{q:"What did the laver provide for the priests?",a:["A place to wash","A place to store grain","A throne"],correct:0,ex:"Priests washed at the laver before ministering."}]},
{title:"The Altar of Sacrifice",icon:"🕯️",tag:"The cost of redemption",reading:"Read the chapters on offerings and sacrifice",body:`<p>Explore the altar and the sacrificial system. Read carefully, ask what Scripture says about the sacrifice, and connect the passages to Christ without rushing past the original setting.</p><p>Compare Leviticus 1 with John 1:29 and Hebrews 10:1–10.</p>`,verses:["Leviticus 1","John 1:29","Hebrews 10:1–10"],challenge:"Explain how the sacrifice points toward Jesus, using at least two Bible texts.",quiz:[{q:"John the Baptist identifies Jesus as:",a:["The temple builder","The Lamb of God","The high priest of Israel's first temple"],correct:1,ex:"John 1:29 calls Jesus the Lamb of God."},{q:"Hebrews 10 describes sacrifices as:",a:["The final solution for sin","A shadow of good things to come","Unrelated to Christ"],correct:1,ex:"Hebrews explains the shadow and fulfillment relationship."}]},
{title:"The Laver: Cleansing",icon:"💧",tag:"Wash and be renewed",reading:"Read Exodus 30:17–21",body:`<p>The laver stood between the altar and the entrance to the tent. The priests washed before service. Reflect on cleansing, holiness and the invitation to draw near to God.</p><p>Read Psalm 51:1–10 and John 13:1–10 alongside the sanctuary instruction.</p>`,verses:["Exodus 30:17–21","Psalm 51:1–10","John 13:1–10"],challenge:"What is the difference between being forgiven and allowing God to renew our hearts?",quiz:[{q:"What was the laver used for?",a:["Washing","Burning incense","Displaying the law"],correct:0,ex:"The priests washed at the laver."},{q:"Psalm 51 asks God for:",a:["A new heart and right spirit","A new kingdom","A new altar"],correct:0,ex:"David prays for inward cleansing and renewal."}]},
{title:"The Holy Place",icon:"🕊️",tag:"Light, bread and prayer",reading:"Explore the Holy Place furniture",body:`<p>Enter the Holy Place in your imagination. The lampstand, table of showbread and altar of incense each invite a deeper study. Work through the Bible descriptions before interpreting the symbolism.</p><p>Read Exodus 25:23–40 and Exodus 30:1–10.</p>`,verses:["Exodus 25:23–40","Exodus 30:1–10","John 6:35","John 8:12"],challenge:"What do the bread, light and incense suggest about the spiritual life? Ground your answer in Scripture.",quiz:[{q:"Which items were in the Holy Place?",a:["Ark and mercy seat only","Lampstand, bread table and incense altar","Laver and altar only"],correct:1,ex:"These three furnishings were in the Holy Place."},{q:"Jesus describes Himself in John 8:12 as:",a:["The light of the world","A golden lampstand","The altar"],correct:0,ex:"Jesus says He is the light of the world."}]},
{title:"The Ark and Mercy Seat",icon:"👑",tag:"Law and mercy",reading:"Read Exodus 25:10–22",body:`<p>The ark and mercy seat occupy a central place in sanctuary imagery. Read the description slowly: the ark, the testimony, the cover and the cherubim.</p><p>Explore how Scripture holds together God's law, His presence and His mercy.</p>`,verses:["Exodus 25:10–22","Psalm 40:8","Hebrews 4:14–16"],challenge:"How do law and mercy fit together in the sanctuary picture?",quiz:[{q:"What was placed inside the ark according to Exodus 25?",a:["The testimony","The lampstand","The laver"],correct:0,ex:"The testimony was placed inside the ark."},{q:"Hebrews 4 invites believers to approach God's throne for:",a:["Grace and mercy","Earthly riches","Political authority"],correct:0,ex:"We approach for mercy and grace in time of need."}]},
{title:"The Priesthood",icon:"🧑‍⚖️",tag:"Representing and serving",reading:"Study the priesthood chapters",body:`<p>Explore the calling, garments and service of the priests. The sanctuary's ministry was not performed at random; it had roles, responsibilities and consecration.</p><p>Read Exodus 28–29 and Hebrews 4:14–16. Ask how the priesthood points to Christ's ministry.</p>`,verses:["Exodus 28–29","Hebrews 4:14–16","Hebrews 7:23–28"],challenge:"What makes Jesus a uniquely qualified High Priest?",quiz:[{q:"What does Hebrews emphasize about Jesus as High Priest?",a:["He understands our weaknesses","He is distant from humanity","He needs repeated sacrifices"],correct:0,ex:"Hebrews presents Jesus as compassionate and sinless."},{q:"Priestly garments in Exodus were described as:",a:["For glory and beauty","For military disguise","For ordinary farming"],correct:0,ex:"Exodus 28 describes garments for glory and beauty."}]},
{title:"The Daily Ministry",icon:"📜",tag:"A continual ministry",reading:"Study the daily service in Haskell",body:`<p>Explore the daily ministry and the offerings connected with it. Use the chapter and the Bible texts as your guide, noting the distinctions Haskell makes between types and antitypes.</p><p>Read Exodus 29:38–46 and Hebrews 9:1–14.</p>`,verses:["Exodus 29:38–46","Hebrews 9:1–14"],challenge:"Summarize the daily service and explain what Haskell sees it foreshadowing.",quiz:[{q:"Exodus 29 describes:",a:["Daily offerings","The Feast of Tabernacles only","The building of Solomon's temple"],correct:0,ex:"The passage gives instructions for daily offerings."},{q:"Hebrews 9 discusses:",a:["The sanctuary and its services","Only the Garden of Eden","A genealogy"],correct:0,ex:"Hebrews 9 explores sanctuary service and Christ."}]},
{title:"The Annual Feasts",icon:"🌾",tag:"A prophetic calendar",reading:"Study Haskell's chapters on the feasts",body:`<p>Israel's annual feasts provided a rhythm of remembrance, worship and prophetic symbolism. Explore the feasts in Leviticus 23 and notice their sequence and meaning.</p><p>Use Haskell's explanations as a guide, and compare every claim with the Bible passages.</p>`,verses:["Leviticus 23","1 Corinthians 5:7–8","Colossians 2:16–17"],challenge:"Create a timeline of the feasts. What themes and connections to Christ can you find?",quiz:[{q:"Where are Israel's annual feasts outlined?",a:["Leviticus 23","Genesis 1","Acts 2"],correct:0,ex:"Leviticus 23 outlines the appointed feasts."},{q:"Paul calls Christ:",a:["Our Passover","Our laver","Our lampstand"],correct:0,ex:"1 Corinthians 5:7 refers to Christ our Passover."}]},
{title:"The Day of Atonement",icon:"⚖️",tag:"The solemn service",reading:"Study the Day of Atonement chapters",body:`<p>The Day of Atonement is a major focus of sanctuary study. Examine the biblical service, its sequence, the high priest's role and the distinctions between the offerings.</p><p>Read Leviticus 16 and Leviticus 23:26–32. Then compare Haskell's explanation and note where it develops prophetic applications.</p>`,verses:["Leviticus 16","Leviticus 23:26–32","Hebrews 9:23–28"],challenge:"Walk through the Day of Atonement service step-by-step from Leviticus 16.",quiz:[{q:"Which chapter describes the Day of Atonement service in detail?",a:["Leviticus 16","Exodus 3","Acts 15"],correct:0,ex:"Leviticus 16 gives detailed instructions for the service."},{q:"Who entered the Most Holy Place in the annual service?",a:["The high priest","Every Israelite","The king"],correct:0,ex:"The high priest performed the specified service."}]},
{title:"The Heavenly Sanctuary",icon:"🌌",tag:"Christ our High Priest",reading:"Study Haskell's heavenly sanctuary material",body:`<p>The earthly sanctuary points beyond itself. Explore the New Testament's descriptions of Christ's ministry in heaven, while carefully distinguishing direct biblical language from theological interpretation.</p><p>Read Hebrews 8:1–2, Hebrews 9:24 and Revelation 11:19.</p>`,verses:["Hebrews 8:1–2","Hebrews 9:24","Revelation 11:19"],challenge:"What does the New Testament explicitly say about Christ's ministry in heaven?",quiz:[{q:"Hebrews describes Christ as ministering in:",a:["The true tabernacle","The Roman temple","A human palace"],correct:0,ex:"Hebrews 8 describes the true tabernacle."},{q:"Hebrews 9:24 says Christ entered:",a:["Heaven itself","The wilderness","A city gate"],correct:0,ex:"Christ appears in the presence of God for us."}]},
{title:"Judgment and Restoration",icon:"🌄",tag:"The story reaches its horizon",reading:"Study the closing chapters",body:`<p>Explore the judgment and restoration themes that Haskell draws from the sanctuary. Read the prophetic passages alongside the book, keeping Scripture and interpretation clearly distinguished.</p><p>Finish with Revelation 21–22: the sanctuary story points toward God's restored presence with His people.</p>`,verses:["Daniel 8:14","Revelation 20–22","Revelation 21:3"],challenge:"How does the sanctuary theme move from God's dwelling among Israel to God's dwelling with the redeemed?",quiz:[{q:"Revelation 21:3 promises:",a:["God dwelling with humanity","The return to the wilderness","The end of God's presence"],correct:0,ex:"God will dwell with His people."},{q:"What is the final picture in Revelation 22?",a:["Restoration and life with God","A new sacrificial altar","The return to Egypt"],correct:0,ex:"Revelation closes with the promise of life and Christ's return."}]}
];
let completed=JSON.parse(localStorage.getItem("sqdone")||"[]");
let xp=Number(localStorage.getItem("sqxp")||0);
function save(){localStorage.setItem("sqdone",JSON.stringify(completed));localStorage.setItem("sqxp",xp)}
function home(){renderHome()}
function showMap(){renderMap()}
function about(){document.getElementById("app").innerHTML=`<div class="content"><div class="card"><h1>About Sanctuary Quest</h1><p>This interactive study journey is inspired by S. N. Haskell's <em>The Cross and Its Shadow</em>. It pairs reading prompts with Bible passages, quizzes and reflection.</p><p>The lessons are a guided learning framework, not a replacement for reading the book. Some lesson titles and groupings are thematic; follow the book's actual chapter sequence when reading.</p><p>Your progress is saved in your browser on this device. If you share the website, each person has their own local progress.</p><button onclick="home()">Back home</button></div></div>`}
function renderHome(){let pct=Math.round(completed.length/lessons.length*100);document.getElementById("app").innerHTML=`<section class="hero"><div><div class="eyebrow">An interactive Bible study adventure</div><h1>Discover Jesus<br>in the Sanctuary.</h1><p>Explore the symbols, services, priesthood and prophetic story of the sanctuary through Scripture and <em>The Cross and Its Shadow</em>.</p><button onclick="showMap()">Begin your journey →</button></div><div class="hero-art">🏛️</div></section><div class="grid"><div class="card"><div class="small">MISSIONS COMPLETED</div><div class="stat">${completed.length}/${lessons.length}</div><div class="progress"><div style="width:${pct}%"></div></div></div><div class="card"><div class="small">EXPERIENCE POINTS</div><div class="stat">${xp} XP</div><p>Earn XP as you explore and complete missions.</p></div><div class="card"><div class="small">YOUR CURRENT RANK</div><div class="stat" style="font-size:1.35rem">${rank()}</div><p>Keep learning, keep discovering.</p></div></div><section class="section"><h2>Your journey</h2><div class="lesson-grid">${lessons.slice(0,4).map((l,i)=>tile(l,i)).join("")}</div><p style="text-align:center"><button class="secondary" onclick="showMap()">View all missions</button></p></section>`}
function rank(){return ["Sanctuary Seeker","Court Explorer","Holy Place Investigator","Priesthood Apprentice","Atonement Scholar","Sanctuary Master"][Math.min(5,Math.floor(xp/100))]}
function tile(l,i){return `<div class="card lesson" onclick="openLesson(${i})"><div class="num">MISSION ${String(i+1).padStart(2,"0")} ${completed.includes(i)?"✓ COMPLETE":""}</div><h3>${l.icon} ${l.title}</h3><p>${l.tag}</p><span class="pill">${l.reading}</span></div>`}
function renderMap(){document.getElementById("app").innerHTML=`<div class="section"><div class="eyebrow">Quest map</div><h1>Choose your mission</h1><p class="small">Complete missions in order or explore freely. The book remains your primary reading source.</p><div class="lesson-grid">${lessons.map((l,i)=>tile(l,i)).join("")}</div></div>`}
function openLesson(i){let l=lessons[i];document.getElementById("app").innerHTML=`<div class="content"><button class="secondary" onclick="showMap()">← Back to missions</button><div class="card" style="margin-top:14px"><div class="eyebrow">Mission ${i+1} of ${lessons.length}</div><h1>${l.icon} ${l.title}</h1><p class="small">📖 ${l.reading}</p><h3>Story briefing</h3>${l.body}<h3>Scripture trail</h3><ul>${l.verses.map(v=>`<li>${v}</li>`).join("")}</ul><div class="question"><strong>🗝️ Mystery challenge</strong><p>${l.challenge}</p><textarea id="reflection" placeholder="Write your discoveries here…" style="width:100%;min-height:100px;background:#0b1220;color:white;border:1px solid #263652;border-radius:12px;padding:12px"></textarea><p class="small">Your response is not graded. Save it for your own reflection.</p></div><h3>Knowledge check</h3>${l.quiz.map((q,qi)=>question(q,qi)).join("")}<button onclick="grade(${i})">Check my answers</button><div id="quizfeedback"></div><p style="margin-top:22px"><button class="secondary" onclick="finish(${i})">${completed.includes(i)?"Mission completed ✓":"Mark mission complete (+50 XP)"}</button></p></div></div>`}
function question(q,qi){return `<div class="question"><strong>${qi+1}. ${q.q}</strong>${q.a.map((a,ai)=>`<label><input type="radio" name="q${qi}" value="${ai}">${a}</label>`).join("")}<div class="feedback" id="f${qi}"></div></div>`}
function grade(i){let l=lessons[i],score=0;l.quiz.forEach((q,qi)=>{let pick=document.querySelector(`input[name="q${qi}"]:checked`),f=document.getElementById("f"+qi);if(pick&&Number(pick.value)===q.correct){score++;f.textContent="Correct! "+q.ex}else f.textContent="Review: "+q.ex});document.getElementById("quizfeedback").innerHTML=`<p class="feedback">You got ${score} of ${l.quiz.length}. ${score===l.quiz.length?"Excellent work!":"Review the explanations and try again."}</p>`;if(score===l.quiz.length){if(!completed.includes(i)){xp+=10;save();document.getElementById("quizfeedback").innerHTML+=`<p class="feedback">+10 XP awarded!</p>`}}}
function finish(i){if(!completed.includes(i)){completed.push(i);xp+=50;save()}renderHome()}
renderHome();
</script></body></html>
